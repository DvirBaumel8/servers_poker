# nginx/nginx.conf
# Production reverse proxy for BotRoyale backend
# Option A: Cloudflare Free Tier (RECOMMENDED for Oracle free tier)
#
# Cloudflare terminates TLS at edge. Oracle only needs port 80 open.
# Cloudflare adds X-Forwarded-For and X-Forwarded-Proto automatically.
#
# Oracle Security List: allow TCP 80 from 0.0.0.0/0 (restrict to Cloudflare IPs via WAF if needed)
# Cloudflare SSL/TLS mode: "Full" (not "Flexible" or "Full Strict") — backend doesn't need a cert.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;   # Writable by non-root in the container

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Use X-Forwarded-For from Cloudflare as the real client IP
  # Cloudflare IP ranges (as of 2024): https://www.cloudflare.com/ips-v4/
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Logging — capture real IPs post-Cloudflare
  log_format main '$remote_addr - $request_time "$request" '
                  '$status $body_bytes_sent '
                  '"$http_x_forwarded_for" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Allow 5MB body + headroom (matches NestJS default 5MB limit)
  client_max_body_size 10m;
  server_tokens off;

  # Upstream: backend container on the internal docker network
  upstream backend {
    server backend:3000;
    keepalive 16;              # Persistent connections to NestJS
  }

  server {
    listen 80;
    server_name api.yourdomain.com;   # CHANGE THIS to your actual domain

    # ── Security headers ─────────────────────────────────────────────
    # Cloudflare adds HSTS at edge; don't duplicate here
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── REST API ─────────────────────────────────────────────────────
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
    }

    # ── Socket.IO upgrade (covers /game and /tournament namespaces) ───
    # Socket.IO uses /socket.io/ for the HTTP handshake regardless of namespace.
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      # WebSocket upgrade headers (required for ws:// upgrade)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # Long timeout for persistent WebSocket connections (24 hours)
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ── Health check (for Cloudflare health monitoring) ──────────────
    location = /api/v1/health {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      access_log off;
    }

    # ── Block anything not matched ────────────────────────────────────
    location / {
      return 404;
    }
  }
}
