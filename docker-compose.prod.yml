# Production Docker Compose — BotRoyale on Oracle ARM
# Requires: .env.production file in this directory
# Usage: docker compose -f docker-compose.prod.yml up -d
# Migrations: docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
# Logs: docker compose -f docker-compose.prod.yml logs -f

version: "3.9"

services:

  # ─── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - poker-prod-network
    user: "999:999"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Backend (NestJS from GHCR) ───────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: poker-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - poker-prod-network
    user: "1001:1001"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── nginx Reverse Proxy (Cloudflare option — HTTP 80 only) ──────────
  nginx:
    image: nginx:1.27-alpine
    container_name: poker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - poker-prod-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─── DB Migration (one-shot, profile-gated) ───────────────────────────
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: poker-migrate
    restart: "no"
    profiles:
      - migrate
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    command: ["node", "dist/src/migrations/run.js"]
    networks:
      - poker-prod-network
    user: "1001:1001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  redis-data:
    driver: local

networks:
  poker-prod-network:
    driver: bridge
