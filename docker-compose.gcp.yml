# GCP Free Tier Docker Compose — BotRoyale on e2-micro (1 GB RAM)
# Memory budget: OS≈200MB, nginx≈40MB, Redis≈80MB, Backend≈650MB, buffer≈54MB
#
# Prerequisites on the GCP instance:
#   1. Run: bash scripts/setup-swap.sh    (creates 2GB swap — MANDATORY)
#   2. Create /opt/botroyale/.env.production from .env.production.example
#
# Usage:
#   docker compose -f docker-compose.gcp.yml up -d
#   docker compose -f docker-compose.gcp.yml --profile migrate run --rm migrate
#   docker compose -f docker-compose.gcp.yml logs -f

version: "3.9"

services:

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    # maxmemory caps Redis heap; allkeys-lru evicts least-recently-used keys
    # when the limit is hit, so the process never grows beyond ~80 MB RSS.
    # appendonly disabled to avoid fsync overhead on a burstable VM.
    command: >
      redis-server
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --save ""
        --loglevel warning
    volumes:
      - redis-data:/data
    mem_limit: 100m
    memswap_limit: 100m      # no extra swap for redis — it must stay in RAM
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - poker-gcp-network
    user: "999:999"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ─── Backend (NestJS from GHCR) ───────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: poker-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Cap V8 old-space at 600MB; total Node.js RSS ≈ heap + ~100MB overhead.
      # Combined with the 700MB container limit this leaves a small safety margin.
      - NODE_OPTIONS=--max-old-space-size=600 --max-semi-space-size=32
      # Keep the worker pool and DB connections lean on a 1-vCPU host.
      - WORKER_POOL_SIZE=1
      - DB_POOL_SIZE=5
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 700m
    # Allow backend to spill into swap (2GB swap configured by setup-swap.sh)
    # during heavy simulation bursts while keeping redis/nginx in RAM.
    memswap_limit: 1400m
    cpus: "0.70"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s          # give NestJS extra time to boot on 1 vCPU
    networks:
      - poker-gcp-network
    user: "1001:1001"
    logging:
      driver: json-file
      options:
        max-size: "30m"          # smaller than prod — disk is more precious here
        max-file: "3"

  # ─── nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: poker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 50m
    memswap_limit: 50m
    cpus: "0.05"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - poker-gcp-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ─── DB Migration (one-shot, profile-gated) ───────────────────────────────
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: poker-migrate
    restart: "no"
    profiles:
      - migrate
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
    command: ["node", "dist/src/migrations/run.js"]
    mem_limit: 350m
    memswap_limit: 500m
    networks:
      - poker-gcp-network
    user: "1001:1001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  redis-data:
    driver: local

networks:
  poker-gcp-network:
    driver: bridge
